name: Validar aplicação

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 em Pernambuco (UTC-3).
    - cron: '0 9 * * *'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-app.mjs
      - run: node scripts/validate-vistorias.mjs
      - run: node scripts/validate-release.mjs
      - run: node scripts/validate-encerramento.mjs
      - run: node scripts/validate-appearance.mjs
      - run: node scripts/validate-admin-alerts.mjs
