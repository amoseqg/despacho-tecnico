<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoField | Gestão Inteligente de Operações de Campo</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px"><strong style="font-size:24px">NexoField</strong><br><span>Gestão Inteligente de Operações de Campo</span><br><br>Carregando sistema...</div><script>
(async()=>{try{const versao='2.3.1';const urls=['/app.part1a?v='+versao,'/app.part1b?v='+versao,'/app.part2?v='+versao,'/app.part3?v='+versao];const [raw,stock]=await Promise.all([Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()}))),fetch('/stock-export.js?v='+versao,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('stock-export.js '+r.status);return r.text()})]);const chunks=raw.map((b,i)=>{const a=new Uint8Array(b);return i<raw.length-1&&a[a.length-1]===10?a.subarray(0,a.length-1):a});const total=chunks.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(total);let p=0;for(const b of chunks){all.set(b,p);p+=b.byteLength}let html=new TextDecoder().decode(all);if(!html.includes("function showLogin(t)")||!html.includes('id="card-tec"')||!html.includes('id="card-adm"')||!html.includes('id="card-log"')||!/<\/html>\s*$/i.test(html)||html.includes('Warning: truncated output'))throw new Error('Arquivos da aplicação incompletos');html=html.replace('/release-info.js?v=2.0.5','/release-info.js?v='+versao).replace('</body>','<script>'+stock+'<\/script></body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:30px;color:#b91c1c">Não foi possível carregar o NexoField. Atualize a página.</p>';console.error(e)}})();
</script></body></html>
