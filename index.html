<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoField | Gestão Inteligente de Operações de Campo</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px"><strong style="font-size:24px">NexoField</strong><br><span>Gestão Inteligente de Operações de Campo</span><br><br>Carregando sistema...</div><script>
(async()=>{try{const urls=['/app.part1','/app.part2','/app.part3'];const raw=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()})));const chunks=raw.map((b,i)=>{const a=new Uint8Array(b);return i<raw.length-1&&a[a.length-1]===10?a.subarray(0,a.length-1):a});const total=chunks.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(total);let p=0;for(const b of chunks){all.set(b,p);p+=b.byteLength}const html=new TextDecoder().decode(all);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:30px;color:#b91c1c">Não foi possível carregar o NexoField. Atualize a página.</p>';console.error(e)}})();
</script></body></html>
