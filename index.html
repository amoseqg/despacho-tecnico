<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Despacho Técnico</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px">Carregando sistema...</div><script>
(async()=>{try{const urls=['/app.part1','/app.part2','/app.part3'];const chunks=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()})));const total=chunks.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(total);let p=0;for(const b of chunks){all.set(new Uint8Array(b),p);p+=b.byteLength}const html=new TextDecoder().decode(all);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:30px;color:#b91c1c">Não foi possível carregar o sistema. Atualize a página.</p>';console.error(e)}})();
</script></body></html>
