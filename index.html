<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoField | Gestão Inteligente de Operações de Campo</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px"><strong style="font-size:24px">NexoField</strong><br><span>Gestão Inteligente de Operações de Campo</span><br><br>Carregando sistema...</div><script>
(async()=>{try{const urls=['/app.part1','/app.part2','/app.part3'];const raw=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()})));const chunks=raw.map((b,i)=>{const a=new Uint8Array(b);return i<raw.length-1&&a[a.length-1]===10?a.subarray(0,a.length-1):a});const total=chunks.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(total);let p=0;for(const b of chunks){all.set(b,p);p+=b.byteLength}let html=new TextDecoder().decode(all);
html=html.replace(/Despacho Técnico/g,'NexoField').replace(/Despacho Tecnico/g,'NexoField');
const brandingStyle=`<style>
:root{--nf-blue:#2563eb;--nf-blue2:#1d4ed8;--nf-navy:#0f172a}
.nf-logo{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--nf-blue),#60a5fa);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:-.03em;box-shadow:0 6px 16px rgba(37,99,235,.28);vertical-align:middle;margin-right:8px}
.header h1{align-items:center}.header h1 .nf-brand-name{font-weight:800;letter-spacing:-.02em}
#t0 .nf-login-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:7px}
#t0 .nf-login-brand .nf-logo{width:44px;height:44px;border-radius:13px;font-size:.9rem;margin-right:0}
#t0 .nf-login-brand .nf-brand-name{color:#fff;font-size:1.55rem;font-weight:800;letter-spacing:-.035em}
#t0 .nf-tagline{color:#cbd5e1!important;font-size:.78rem!important}
</style>`;
html=html.replace('</head>',brandingStyle+'</head>');
const brandingScript=`<script>(function(){function aplicarNexoField(){document.title='NexoField | Gestão Inteligente de Operações de Campo';document.querySelectorAll('.header h1').forEach(function(h){h.innerHTML='<span class="nf-logo">NF</span><span class="nf-brand-name">NexoField</span>';});var login=document.querySelector('#t0 h1');if(login){login.outerHTML='<div class="nf-login-brand"><span class="nf-logo">NF</span><span class="nf-brand-name">NexoField</span></div>';}var p=document.querySelector('#t0 .nf-login-brand + p');if(p){p.textContent='Gestão Inteligente de Operações de Campo';p.classList.add('nf-tagline');}var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var n;while(n=walker.nextNode()){if(n.nodeValue&&(/Despacho Técnico|Despacho Tecnico/.test(n.nodeValue))){n.nodeValue=n.nodeValue.replace(/Despacho Técnico/g,'NexoField').replace(/Despacho Tecnico/g,'NexoField');}}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',aplicarNexoField);}else{aplicarNexoField();}setTimeout(aplicarNexoField,600);})();<\/script>`;
html=html.replace('</body>',brandingScript+'</body>');
document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:30px;color:#b91c1c">Não foi possível carregar o NexoField. Atualize a página.</p>';console.error(e)}})();
</script></body></html>
